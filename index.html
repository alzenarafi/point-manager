<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Point Manager</title>
<style>
  :root{--bg:#0b0c10;--card:#181b22;--field:#20242e;--text:#f2f2f2;--muted:#9aa0a8;--accent:#e5484d;--ok:#30a46c;--border:#2a2e37;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
  @media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#eef0f3;--card:#fff;--field:#f2f3f5;--text:#1a1a1a;--muted:#6b7280;--border:#e5e7eb;}}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:20px}
  .card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--border);border-radius:20px;
    padding:24px 20px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  h1{font-size:18px;text-align:center;margin:0 0 20px;letter-spacing:.2px}
  .dropdown{position:relative}
  .dd-button{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--border);background:var(--field);
    color:var(--text);font-size:16px;text-align:left;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
  .dd-button .arrow{transition:transform .15s;color:var(--muted)}
  .dropdown.open .dd-button{border-color:var(--accent)}
  .dropdown.open .arrow{transform:rotate(180deg)}
  .dd-menu{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--field);border:1px solid var(--border);
    border-radius:14px;max-height:240px;overflow-y:auto;z-index:20;display:none;box-shadow:0 10px 25px rgba(0,0,0,.3)}
  .dropdown.open .dd-menu{display:block}
  .dd-item{padding:12px 16px;font-size:15px;cursor:pointer}
  .dd-item:hover,.dd-item.active{background:var(--accent);color:#fff}
  .helper{font-size:12px;color:var(--muted);line-height:1.5;margin:16px 0 8px}
  .info{display:flex;gap:10px;margin-top:12px}
  .info .box{flex:1;background:var(--field);border-radius:14px;padding:12px 14px;text-align:center}
  .info .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
  .info .value{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
  .actions{display:flex;gap:10px;margin-top:12px}
  input[type=number]{flex:1;min-width:0;padding:14px;border-radius:14px;border:1px solid var(--border);
    background:var(--field);color:var(--text);font-size:18px;text-align:center;-moz-appearance:textfield}
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  button{border:none;border-radius:14px;font-size:20px;font-weight:700;cursor:pointer;width:52px;flex-shrink:0}
  .btn-minus{background:var(--accent);color:#fff}
  .btn-plus{background:var(--ok);color:#fff}
  button:disabled{opacity:.4}
  .status{margin-top:14px;padding:10px 12px;border-radius:10px;font-size:13px;text-align:center;display:none}
  .status.show{display:block}
  .status.ok{background:rgba(48,164,108,.15);color:var(--ok)}
  .status.err{background:rgba(229,72,77,.15);color:var(--accent)}
  .muted{color:var(--muted);font-size:13px;text-align:center}
</style>
</head>
<body>
<div class="card">
  <h1>Mineverse Point Manager</h1>

  <div class="dropdown" id="dropdown">
    <button type="button" class="dd-button" id="ddButton">
      <span id="ddLabel">Pilih nama staff...</span>
      <span class="arrow">▾</span>
    </button>
    <div class="dd-menu" id="ddMenu"></div>
  </div>

  <div class="info">
    <div class="box"><div class="label">ID</div><div class="value" id="pCode">-</div></div>
    <div class="box"><div class="label">Point</div><div class="value" id="pPoint">-</div></div>
  </div>

  <div class="helper">Masukkan jumlah point pada kolom di bawah ini, lalu tekan <strong>−</strong> untuk mengurangi atau <strong>+</strong> untuk menambahkan point staff yang dipilih.</div>

  <div class="actions">
    <input type="number" id="amount" min="1" value="1">
    <button class="btn-minus" id="btnMinus" onclick="submitChange(-1)" disabled>−</button>
    <button class="btn-plus" id="btnPlus" onclick="submitChange(1)" disabled>+</button>
  </div>

  <div class="status" id="status"></div>
</div>

<script>
const WORKER_URL = "https://point-manager.mineversepersonal.workers.dev";

let members = [];
let selected = null;

const dropdown = document.getElementById("dropdown");
const ddButton = document.getElementById("ddButton");
const ddMenu = document.getElementById("ddMenu");
const ddLabel = document.getElementById("ddLabel");

async function loadMembers(){
  try{
    const res = await fetch(WORKER_URL + "/members");
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || "Gagal memuat data");
    members = data.members || [];
    ddMenu.innerHTML = members.map((m,i)=>`<div class="dd-item" data-idx="${i}">${m.name}</div>`).join("");
    ddMenu.querySelectorAll(".dd-item").forEach(el=>{
      el.addEventListener("click", ()=> selectMember(parseInt(el.dataset.idx,10)));
    });
  }catch(e){
    ddLabel.textContent = "❌ Gagal memuat data";
    showStatus("❌ " + e.message + " (cek WORKER_URL sudah diganti?)", false);
  }
}

ddButton.addEventListener("click", ()=> dropdown.classList.toggle("open"));
document.addEventListener("click", e=>{
  if(!dropdown.contains(e.target)) dropdown.classList.remove("open");
});

function selectMember(idx){
  selected = members[idx];
  ddLabel.textContent = selected.name;
  document.getElementById("pCode").textContent = selected.code;
  document.getElementById("pPoint").textContent = selected.point;
  document.getElementById("btnMinus").disabled = false;
  document.getElementById("btnPlus").disabled = false;
  document.getElementById("status").className = "status";
  dropdown.classList.remove("open");
}

async function submitChange(sign){
  if(!selected) return;
  const amt = parseInt(document.getElementById("amount").value, 10);
  if(!amt || amt <= 0){ showStatus("Isi jumlah point yang valid.", false); return; }
  const delta = sign * amt;
  showStatus("Memproses...", null);
  try{
    const res = await fetch(WORKER_URL + "/update", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({pageId: selected.id, delta})
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error?.message || data.error || "Gagal update");
    selected.point = data.newPoint;
    document.getElementById("pPoint").textContent = data.newPoint;
    const idx = members.findIndex(x=>x.id===selected.id);
    if(idx>-1) members[idx].point = data.newPoint;
    showStatus(`✅ Berhasil! Point baru: ${data.newPoint}`, true);
  }catch(e){
    showStatus("❌ " + e.message, false);
  }
}

function showStatus(msg, ok){
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = "status show" + (ok===true?" ok":ok===false?" err":"");
}

loadMembers();
</script>
</body>
</html>
